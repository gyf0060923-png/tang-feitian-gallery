<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d0b"><meta name="description" content="横向沉浸式敦煌飞天互动展馆。真实壁画、拖拽漫游、局部放大与画面取色，图片来源敦煌研究院。"><title>天衣飞扬 · 敦煌飞天交互展馆</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="museum.css"><link rel="stylesheet" href="glass.css"></head><body><header><a class="brand" href="#home" aria-label="天衣飞扬首页"><span class="seal">飞<br>天</span><span>天衣飞扬<small>APSARAS · DUNHUANG</small></span></a><nav aria-label="主导航"></nav><button class="sound" id="sound" aria-pressed="false"><span>◌</span> 听见风</button></header><main><section class="studio section" id="studio"><div class="studio-heading"><div><h2>拂袖，<em>自成一境。</em></h2><p>拖动绘制飘带 · 选择飞天配色 · 保存你的流光</p></div><button class="outline" id="saveArt">保存画境 ↓</button></div><div class="canvas-wrap"><canvas id="ribbonCanvas" aria-label="飘带绘画画布，按住鼠标或手指拖动画出飘带"></canvas><div class="canvas-title" aria-hidden="true">风起<br><span>敦煌</span></div><div class="canvas-hint" id="canvasHint">✧ 按住拖动，画一缕风</div><span class="canvas-stamp">天衣飞扬<br>数字画境</span></div><div class="studio-tools"><label>风的速度 <input id="wind" type="range" min="0" max="100" value="40"><output id="windValue">40</output></label><div class="draw-colors" role="group" aria-label="飘带配色"><button style="--draw:#377b78" data-draw-color="0" aria-pressed="true">石绿</button><button style="--draw:#bc4830" data-draw-color="1" aria-pressed="false">朱砂</button><button style="--draw:#c2a36e" data-draw-color="2" aria-pressed="false">沙金</button><button style="--draw:#747d9d" data-draw-color="3" aria-pressed="false">青黛</button></div><div><button id="motion" aria-pressed="true">◌ 流动中</button><button id="clearCanvas">重绘 ↺</button></div></div><p class="sr-only" id="exportStatus" aria-live="polite"></p></section></main><script src="app.js"></script><script src="museum.js"></script></body></html>
